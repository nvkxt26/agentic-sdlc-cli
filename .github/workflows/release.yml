name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # push commit + tag to main
  packages: write   # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nvkxt26'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (no git tag yet)
        run: npm version ${{ inputs.release_type }} --no-git-tag-version

      - name: Get new version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sync package-lock.json
        run: npm install --package-lock-only

      - name: Build
        run: npm run build

      - name: Update README version badge
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "s|release-v[0-9]*\.[0-9]*\.[0-9]*-blue|release-v${VERSION}-blue|g" README.md

      - name: Commit release
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git add package.json package-lock.json README.md
          git commit -m "[RELEASE]: bump version to v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --follow-tags

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
